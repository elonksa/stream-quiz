<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream Quiz Game - Twitch</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-twitch: #9146ff;
            --text-color: #f8fafc;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        h1 { text-align: center; margin-bottom: 20px; color: #38bdf8; }

        .connection-panel {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 25px;
            background: #090d16;
            padding: 15px;
            border-radius: 12px;
        }

        .input-group { display: flex; flex-direction: column; gap: 5px; }
        label { font-size: 0.9em; font-weight: bold; }
        input {
            padding: 10px; border-radius: 6px; border: 1px solid #334155;
            background: #1e293b; color: #fff; outline: none;
        }

        button {
            padding: 12px; border: none; border-radius: 8px;
            background: #9146ff; color: white; font-weight: bold; font-size: 1em;
            cursor: pointer; transition: 0.2s;
        }
        button:hover { background: #772ce8; }

        .status-bar { display: flex; justify-content: center; margin-bottom: 20px; font-size: 0.85em; }
        .status-indicator { padding: 6px 12px; border-radius: 20px; background: #334155; }
        .status-indicator.connected { background: #15803d; color: white; }

        .quiz-card {
            background: #0f172a; padding: 20px; border-radius: 12px;
            border: 2px solid #334155; text-align: center;
        }

        .question { font-size: 1.4em; font-weight: bold; margin-bottom: 15px; }
        .options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .option-btn {
            background: #1e293b; padding: 12px; border-radius: 8px;
            border: 1px solid #475569; font-size: 1em; text-align: right;
        }

        .scores { margin-top: 25px; }
        .scores h3 { border-bottom: 2px solid #334155; padding-bottom: 5px; }
        .score-list { list-style: none; padding: 0; max-height: 200px; overflow-y: auto; }
        .score-item {
            display: flex; justify-content: space-between; padding: 8px 12px;
            background: #1e293b; margin-bottom: 5px; border-radius: 6px;
        }
        .badge-twitch { color: var(--accent-twitch); font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h1>🎮 مسابقة البث المباشر (Twitch)</h1>

    <div class="connection-panel">
        <div class="input-group">
            <label for="twitchUser">اسم قناة Twitch:</label>
            <input type="text" id="twitchUser" placeholder="اكتب اسم قناتك هنا">
        </div>
        <button onclick="connectTwitch()">اتصال بالشات 🚀</button>
    </div>

    <div class="status-bar">
        <span id="twitchStatus" class="status-indicator">Twitch: غير متصل</span>
    </div>

    <div class="quiz-card">
        <div class="question" id="questionText">أرسل (A) أو (B) أو (C) أو (D) في الشات لاحتساب النقاط!</div>
        <div class="options" id="optionsContainer">
            <div class="option-btn">A) الخيار الأول</div>
            <div class="option-btn">B) الخيار الثاني</div>
            <div class="option-btn">C) الخيار الثالث</div>
            <div class="option-btn">D) الخيار الرابع</div>
        </div>
    </div>

    <div class="scores">
        <h3>🏆 لائحة الصدارة:</h3>
        <ul class="score-list" id="scoreList"></ul>
    </div>
</div>

<script>
    let twitchWS = null;
    let currentAnswer = "A"; 
    let scores = {};

    function connectTwitch() {
        const username = document.getElementById('twitchUser').value.trim().toLowerCase();
        if (!username) return;

        const status = document.getElementById('twitchStatus');
        status.textContent = 'Twitch: جاري الاتصال...';

        if (twitchWS) twitchWS.close();

        twitchWS = new WebSocket('wss://irc-ws.chat.twitch.tv:443');

        twitchWS.onopen = () => {
            twitchWS.send('PASS oauth:schmoopiie');
            twitchWS.send(`NICK justinfan${Math.floor(Math.random() * 80000 + 10000)}`);
            twitchWS.send(`JOIN #${username}`);
            
            status.textContent = `Twitch: متصل (#${username})`;
            status.classList.add('connected');
        };

        twitchWS.onmessage = (event) => {
            const message = event.data;
            if (message.includes('PING')) {
                twitchWS.send('PONG :tmi.twitch.tv');
            }
            if (message.includes('PRIVMSG')) {
                const userMatch = message.match(/^:(\w+)!/);
                const msgMatch = message.match(/PRIVMSG #[^:]+:(.*)/);
                if (userMatch && msgMatch) {
                    handleChatMessage(userMatch[1], msgMatch[1].trim());
                }
            }
        };

        twitchWS.ononerror = () => {
            status.textContent = 'Twitch: خطأ في الاتصال';
            status.classList.remove('connected');
        };

        twitchWS.onclose = () => {
            status.textContent = 'Twitch: غير متصل';
            status.classList.remove('connected');
        };
    }

    function handleChatMessage(username, message) {
        const text = message.trim().toUpperCase();

        if (['A', 'B', 'C', 'D'].includes(text)) {
            if (text === currentAnswer) {
                if (!scores[username]) {
                    scores[username] = { name: username, score: 0 };
                }
                scores[username].score += 10;
                updateLeaderboard();
            }
        }
    }

    function updateLeaderboard() {
        const scoreList = document.getElementById('scoreList');
        scoreList.innerHTML = '';

        const sorted = Object.values(scores).sort((a, b) => b.score - a.score);

        sorted.forEach(player => {
            const li = document.createElement('li');
            li.className = 'score-item';
            li.innerHTML = `
                <span><span class="badge-twitch">[Twitch]</span> ${player.name}</span>
                <span><b>${player.score}</b> نقطة</span>
            `;
            scoreList.appendChild(li);
        });
    }
</script>

</body>
</html>
