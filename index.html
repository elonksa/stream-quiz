<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream Quiz Game - Twitch & Kick</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-twitch: #9146ff;
            --accent-kick: #53fc18;
            --text-color: #f8fafc;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: #38bdf8;
        }

        .connection-panel {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 25px;
            background: #090d16;
            padding: 15px;
            border-radius: 12px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        label {
            font-size: 0.9em;
            font-weight: bold;
        }

        input {
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #334155;
            background: #1e293b;
            color: #fff;
            outline: none;
        }

        .help-text {
            font-size: 0.75em;
            color: #94a3b8;
        }

        button {
            grid-column: span 2;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #0284c7;
            color: white;
            font-weight: bold;
            font-size: 1em;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: #0369a1;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            font-size: 0.85em;
        }

        .status-indicator {
            padding: 6px 12px;
            border-radius: 20px;
            background: #334155;
        }

        .status-indicator.connected {
            background: #15803d;
            color: white;
        }

        .quiz-card {
            background: #0f172a;
            padding: 20px;
            border-radius: 12px;
            border: 2px solid #334155;
            text-align: center;
        }

        .question {
            font-size: 1.4em;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .option-btn {
            background: #1e293b;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #475569;
            font-size: 1em;
            text-align: right;
        }

        .scores {
            margin-top: 25px;
        }

        .scores h3 {
            border-bottom: 2px solid #334155;
            padding-bottom: 5px;
        }

        .score-list {
            list-style: none;
            padding: 0;
            max-height: 200px;
            overflow-y: auto;
        }

        .score-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 12px;
            background: #1e293b;
            margin-bottom: 5px;
            border-radius: 6px;
        }

        .badge-twitch { color: var(--accent-twitch); font-weight: bold; }
        .badge-kick { color: var(--accent-kick); font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h1>🎮 مسابقة البث المباشر (Twitch & Kick)</h1>

    <div class="connection-panel">
        <div class="input-group">
            <label for="twitchUser">اسم قناة Twitch:</label>
            <input type="text" id="twitchUser" placeholder="مثال: elonksa">
        </div>
        <div class="input-group">
            <label for="kickUser">اسم قناة Kick (أو Chatroom ID):</label>
            <input type="text" id="kickUser" placeholder="مثال: 123456 أو اسم القناة">
            <span class="help-text">اكتب اسم القناة، وإذا لم يتصل اكتب رقم الـ Chatroom ID مباشرة</span>
        </div>
        <button onclick="connectAll()">اتصال بالشات 🚀</button>
    </div>

    <div class="status-bar">
        <span id="twitchStatus" class="status-indicator">Twitch: غير متصل</span>
        <span id="kickStatus" class="status-indicator">Kick: غير متصل</span>
    </div>

    <div class="quiz-card">
        <div class="question" id="questionText">أرسل (A) أو (B) أو (C) أو (D) في الشات لاحتساب النقاط!</div>
        <div class="options" id="optionsContainer">
            <div class="option-btn">A) الخيار الأول</div>
            <div class="option-btn">B) الخيار الثاني</div>
            <div class="option-btn">C) الخيار الثالث</div>
            <div class="option-btn">D) الخيار الرابع</div>
        </div>
    </div>

    <div class="scores">
        <h3>🏆 لائحة الصدارة (أسرع إجابات صحيحة):</h3>
        <ul class="score-list" id="scoreList"></ul>
    </div>
</div>

<script>
    let twitchWS = null;
    let kickWS = null;
    let kickPingInterval = null;
    let currentAnswer = "A"; 
    let scores = {};

    function connectAll() {
        connectTwitch();
        connectKick();
    }

    // --- Twitch Connection ---
    function connectTwitch() {
        const username = document.getElementById('twitchUser').value.trim().toLowerCase();
        if (!username) return;

        if (twitchWS) twitchWS.close();

        twitchWS = new WebSocket('wss://irc-ws.chat.twitch.tv:443');

        twitchWS.onopen = () => {
            twitchWS.send('PASS oauth:schmoopiie');
            twitchWS.send(`NICK justinfan${Math.floor(Math.random() * 80000 + 10000)}`);
            twitchWS.send(`JOIN #${username}`);
            
            const status = document.getElementById('twitchStatus');
            status.textContent = `Twitch: متصل (#${username})`;
            status.classList.add('connected');
        };

        twitchWS.onmessage = (event) => {
            const message = event.data;
            if (message.includes('PING')) {
                twitchWS.send('PONG :tmi.twitch.tv');
            }
            if (message.includes('PRIVMSG')) {
                const userMatch = message.match(/^:(\w+)!/);
                const msgMatch = message.match(/PRIVMSG #[^:]+:(.*)/);
                if (userMatch && msgMatch) {
                    handleChatMessage(userMatch[1], msgMatch[1].trim(), 'Twitch');
                }
            }
        };

        twitchWS.onclose = () => {
            const status = document.getElementById('twitchStatus');
            status.textContent = 'Twitch: غير متصل';
            status.classList.remove('connected');
        };
    }

    // --- Kick Connection ---
    async function connectKick() {
        const inputVal = document.getElementById('kickUser').value.trim();
        if (!inputVal) return;

        const status = document.getElementById('kickStatus');
        status.textContent = 'Kick: جاري الاتصال...';

        if (kickWS) {
            clearInterval(kickPingInterval);
            kickWS.close();
        }

        let chatroomId = inputVal;

        // إذا كان المدخل ليس رقماً مجرداً، نحاول الحصول على Chatroom ID من السيرفر
        if (isNaN(inputVal)) {
            try {
                const res = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent('https://kick.com/api/v2/channels/' + inputVal.toLowerCase())}`);
                const data = await res.json();
                const json = JSON.parse(data.contents);
                if (json && json.chatroom && json.chatroom.id) {
                    chatroomId = json.chatroom.id;
                }
            } catch (e) {
                console.log("Could not resolve username via CORS proxy, using raw input.");
            }
        }

        // اتصال مقبس Pusher الخاص بـ Kick
        kickWS = new WebSocket('wss://ws-us2.pusher.com/app/eb1d5f283082ab080b96?protocol=7&client=js&version=7.4.0&flash=false');

        kickWS.onopen = () => {
            console.log("Kick WS Connected. Waiting for connection_established...");
        };

        kickWS.onmessage = (event) => {
            try {
                const parsed = JSON.parse(event.data);

                // بعد تأكيد اتصال Pusher بنجاح، نقوم بالاشتراك بالروم
                if (parsed.event === "pusher:connection_established") {
                    const channelName = isNaN(chatroomId) ? `chatrooms.${chatroomId}.v2` : `chatrooms.${chatroomId}.v2`;
                    
                    kickWS.send(JSON.stringify({
                        event: "pusher:subscribe",
                        data: { auth: "", channel: channelName }
                    }));

                    status.textContent = `Kick: متصل (${inputVal})`;
                    status.classList.add('connected');

                    // إرسال Ping كل 15 ثانية لمنع الفصل التلقائي
                    if (kickPingInterval) clearInterval(kickPingInterval);
                    kickPingInterval = setInterval(() => {
                        if (kickWS && kickWS.readyState === WebSocket.OPEN) {
                            kickWS.send(JSON.stringify({ event: "pusher:ping", data: {} }));
                        }
                    }, 15000);
                }

                // استقبال رسائل الشات
                if (parsed.event === "App\\Events\\ChatMessageEvent") {
                    const msgData = JSON.parse(parsed.data);
                    const sender = msgData.sender ? msgData.sender.username : 'زائر';
                    const content = msgData.content || '';
                    handleChatMessage(sender, content, 'Kick');
                }
            } catch (err) {
                // Ignore unexpected parse errors
            }
        };

        kickWS.onclose = () => {
            status.textContent = 'Kick: غير متصل';
            status.classList.remove('connected');
            if (kickPingInterval) clearInterval(kickPingInterval);
        };

        kickWS.onerror = (err) => {
            console.error("Kick WS error: ", err);
        };
    }

    // --- Scoring Logic ---
    function handleChatMessage(username, message, platform) {
        const text = message.trim().toUpperCase();

        if (['A', 'B', 'C', 'D'].includes(text)) {
            if (text === currentAnswer) {
                const userKey = `${platform}:${username}`;
                if (!scores[userKey]) {
                    scores[userKey] = { name: username, platform: platform, score: 0 };
                }
                scores[userKey].score += 10;
                updateLeaderboard();
            }
        }
    }

    function updateLeaderboard() {
        const scoreList = document.getElementById('scoreList');
        scoreList.innerHTML = '';

        const sorted = Object.values(scores).sort((a, b) => b.score - a.score);

        sorted.forEach(player => {
            const li = document.createElement('li');
            li.className = 'score-item';
            const badgeClass = player.platform === 'Twitch' ? 'badge-twitch' : 'badge-kick';
            li.innerHTML = `
                <span><span class="${badgeClass}">[${player.platform}]</span> ${player.name}</span>
                <span><b>${player.score}</b> نقطة</span>
            `;
            scoreList.appendChild(li);
        });
    }
</script>

</body>
</html>
