<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream Quiz Game - Twitch (أجوبة كتابية)</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-twitch: #9146ff;
            --text-color: #f8fafc;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 850px;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        h1 { text-align: center; margin-bottom: 20px; color: #38bdf8; }

        .connection-panel {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 25px;
            background: #090d16;
            padding: 15px;
            border-radius: 12px;
        }

        .input-group { display: flex; flex-direction: column; gap: 5px; }
        label { font-size: 0.9em; font-weight: bold; }
        input, select {
            padding: 10px; border-radius: 6px; border: 1px solid #334155;
            background: #1e293b; color: #fff; outline: none;
        }

        button {
            padding: 12px; border: none; border-radius: 8px;
            background: var(--accent-twitch); color: white; font-weight: bold; font-size: 1em;
            cursor: pointer; transition: 0.2s;
        }
        button:hover { background: #772ce8; }

        .status-bar { display: flex; justify-content: center; margin-bottom: 20px; font-size: 0.85em; }
        .status-indicator { padding: 6px 12px; border-radius: 20px; background: #334155; }
        .status-indicator.connected { background: #15803d; color: white; }

        .quiz-card {
            background: #0f172a; padding: 20px; border-radius: 12px;
            border: 2px solid #334155; text-align: center;
        }

        .meta-info { display: flex; justify-content: space-between; font-size: 0.85em; color: #94a3b8; margin-bottom: 10px; }
        .question { font-size: 1.4em; font-weight: bold; margin-bottom: 15px; line-height: 1.5; }
        
        .controls-row { display: flex; gap: 10px; margin-top: 15px; }
        .controls-row button { flex: 1; background: #0284c7; }
        .controls-row button:hover { background: #0369a1; }

        .scores { margin-top: 25px; }
        .scores h3 { border-bottom: 2px solid #334155; padding-bottom: 5px; }
        .score-list { list-style: none; padding: 0; max-height: 200px; overflow-y: auto; }
        .score-item {
            display: flex; justify-content: space-between; padding: 8px 12px;
            background: #1e293b; margin-bottom: 5px; border-radius: 6px;
        }
        .badge-twitch { color: var(--accent-twitch); font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h1>🎮 مسابقة البث المباشر (أجوبة كتابية شاملة)</h1>

    <div class="connection-panel">
        <div class="input-group">
            <label for="twitchUser">اسم قناة Twitch:</label>
            <input type="text" id="twitchUser" placeholder="اكتب اسم قناتك هنا">
        </div>
        <button onclick="connectTwitch()">اتصال بالشات 🚀</button>
    </div>

    <div class="status-bar">
        <span id="twitchStatus" class="status-indicator">Twitch: غير متصل</span>
    </div>

    <div class="quiz-card">
        <div class="meta-info">
            <span id="questionCategory">المجال: عام</span>
            <span id="questionDifficulty">الصعوبة: متوسط</span>
        </div>
        <div class="question" id="questionText">اضغط على زر "السؤال التالي" لبدء المسابقة واستقبال إجابات الشات الكتابية!</div>
        
        <div class="controls-row">
            <button onclick="nextQuestion()">السؤال التالي ➡️</button>
            <button onclick="showAnswer()" style="background: #16a34a;">إظهار الإجابة الصحيحة 💡</button>
        </div>
    </div>

    <div class="scores">
        <h3>🏆 لائحة الصدارة:</h3>
        <ul class="score-list" id="scoreList"></ul>
    </div>
</div>

<script>
    let twitchWS = null;
    let scores = {};
    let currentQuestionObj = null;

    // بنك الأسئلة الشامل (مختلف المجالات ومستويات الصعوبة)
    const questionsBank = [
        // سهلة
        { q: "ما هي عاصمة المملكة العربية السعودية؟", a: "الرياض", category: "جغرافيا", diff: "سهل" },
        { q: "كم عدد سور القرآن الكريم؟", a: "114", category: "إسلاميات", diff: "سهل" },
        { q: "ما هو العنصر الكيميائي الذي يرمز له بالرمز H؟", a: "هيدروجين", category: "علوم", diff: "سهل" },
        { q: "أي كوكب يلقب بالكوكب الأحمر؟", a: "المريخ", category: "فضاء", diff: "سهل" },

        // متوسطة
        { q: "في أي عام تأسست شركة أبل؟", a: "1976", category: "تكنولوجيا", diff: "متوسط" },
        { q: "ما هي عاصمة أستراليا وليست سيدني؟", a: "كانبرا", category: "جغرافيا", diff: "متوسط" },
        { q: "من هو واضع علم العروض في اللغة العربية؟", a: "الخليل بن أحمد الفراهيدي", category: "تاريخ وأدب", diff: "متوسط" },
        { q: "ما هو أسرع حيوان بري في العالم؟", a: "الفهد", category: "حيوانات", diff: "متوسط" },

        // صعبة
        { q: "كم عدد العظام في جسم الإنسان البالغ؟", a: "206", category: "علوم طبية", diff: "صعب" },
        { q: "ما هي الدولة التي تمتلك أكبر عدد من الجزر في العالم؟", a: "السويد", category: "جغرافيا", diff: "صعب" },
        { q: "من هو مكتوب قانون الجذب العام؟", a: "اسحاق نيوتن", category: "فيزياء", diff: "صعب" },
        { q: "ما هو أطول نهر في العالم؟", a: "النيل", category: "جغرافيا", diff: "صعب" }
    ];

    function connectTwitch() {
        const username = document.getElementById('twitchUser').value.trim().toLowerCase();
        if (!username) {
            alert("الرجاء إدخال اسم القناة!");
            return;
        }

        const status = document.getElementById('twitchStatus');
        status.textContent = 'Twitch: جاري الاتصال...';

        if (twitchWS) twitchWS.close();

        twitchWS = new WebSocket('wss://irc-ws.chat.twitch.tv:443');

        twitchWS.onopen = () => {
            twitchWS.send('PASS oauth:schmoopiie');
            twitchWS.send(`NICK justinfan${Math.floor(Math.random() * 80000 + 10000)}`);
            twitchWS.send(`JOIN #${username}`);
            
            status.textContent = `Twitch: متصل (#${username})`;
            status.classList.add('connected');
        };

        twitchWS.onmessage = (event) => {
            const message = event.data;
            if (message.includes('PING')) {
                twitchWS.send('PONG :tmi.twitch.tv');
            }
            if (message.includes('PRIVMSG')) {
                const userMatch = message.match(/^:(\w+)!/);
                const msgMatch = message.match(/PRIVMSG #[^:]+:(.*)/);
                if (userMatch && msgMatch) {
                    handleChatMessage(userMatch[1], msgMatch[1].trim());
                }
            }
        };

        twitchWS.onerror = () => {
            status.textContent = 'Twitch: خطأ في الاتصال';
            status.classList.remove('connected');
        };

        twitchWS.onclose = () => {
            status.textContent = 'Twitch: غير متصلة';
            status.classList.remove('connected');
        };
    }

    // الانتقال لسؤال عشوائي جديد
    function nextQuestion() {
        const randomIndex = Math.floor(Math.random() * questionsBank.length);
        currentQuestionObj = questionsBank[randomIndex];

        document.getElementById('questionText').textContent = currentQuestionObj.q;
        document.getElementById('questionCategory').textContent = `المجال: ${currentQuestionObj.category}`;
        document.getElementById('questionDifficulty').textContent = `الصعوبة: ${currentQuestionObj.diff}`;
    }

    // إظهار الإجابة الصحيحة على الشاشة
    function showAnswer() {
        if (!currentQuestionObj) return;
        alert(`الإجابة الصحيحة هي: ${currentQuestionObj.a}`);
    }

    // استقبال الشات والتحقق من الإجابة الكتابية
    function handleChatMessage(username, message) {
        if (!currentQuestionObj) return;

        const userAnswer = message.trim().toLowerCase();
        const correctAnswer = currentQuestionObj.a.toLowerCase();

        // مقارنة الإجابة الكتابية (تدعم التطابق الجزئي أو التام)
        if (userAnswer === correctAnswer || userAnswer.includes(correctAnswer)) {
            if (!scores[username]) {
                scores[username] = { name: username, score: 0 };
            }
            scores[username].score += 10;
            updateLeaderboard();
            
            // تنبيه مؤقت في الكونسول عند إجابة شخص صحيح
            console.log(`فاز اللاعب ${username} بإجابة صحيحة!`);
        }
    }

    function updateLeaderboard() {
        const scoreList = document.getElementById('scoreList');
        scoreList.innerHTML = '';

        const sorted = Object.values(scores).sort((a, b) => b.score - a.score);

        sorted.forEach(player => {
            const li = document.createElement('li');
            li.className = 'score-item';
            li.innerHTML = `
                <span><span class="badge-twitch">[Twitch]</span> ${player.name}</span>
                <span><b>${player.score}</b> نقطة</span>
            `;
            scoreList.appendChild(li);
        });
    }
</script>

</body>
</html>
