<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream Quiz Game</title>
    <!-- استدعاء مكتبة Pusher من CDN موثوق ومستقر -->
    <script src="https://js.pusher.com/8.2.0/pusher.min.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-kick: #53fc18;
            --text-color: #f8fafc;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        h1 { text-align: center; margin-bottom: 20px; color: #38bdf8; }

        .connection-panel {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 25px;
            background: #090d16;
            padding: 15px;
            border-radius: 12px;
        }

        .input-group { display: flex; flex-direction: column; gap: 5px; }
        label { font-size: 0.9em; font-weight: bold; }
        input {
            padding: 10px; border-radius: 6px; border: 1px solid #334155;
            background: #1e293b; color: #fff; outline: none;
        }

        button {
            padding: 12px; border: none; border-radius: 8px;
            background: #0284c7; color: white; font-weight: bold; font-size: 1em;
            cursor: pointer; transition: 0.2s;
        }
        button:hover { background: #0369a1; }

        .status-bar { display: flex; justify-content: center; margin-bottom: 20px; font-size: 0.85em; }
        .status-indicator { padding: 6px 12px; border-radius: 20px; background: #334155; }
        .status-indicator.connected { background: #15803d; color: white; }

        .quiz-card {
            background: #0f172a; padding: 20px; border-radius: 12px;
            border: 2px solid #334155; text-align: center;
        }

        .question { font-size: 1.4em; font-weight: bold; margin-bottom: 15px; }
        .options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .option-btn {
            background: #1e293b; padding: 12px; border-radius: 8px;
            border: 1px solid #475569; font-size: 1em; text-align: right;
        }

        .scores { margin-top: 25px; }
        .scores h3 { border-bottom: 2px solid #334155; padding-bottom: 5px; }
        .score-list { list-style: none; padding: 0; max-height: 200px; overflow-y: auto; }
        .score-item {
            display: flex; justify-content: space-between; padding: 8px 12px;
            background: #1e293b; margin-bottom: 5px; border-radius: 6px;
        }
        .badge-kick { color: var(--accent-kick); font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h1>🎮 مسابقة البث المباشر (Kick Chat)</h1>

    <div class="connection-panel">
        <div class="input-group">
            <label for="kickUser">معرف شات Kick (Chatroom ID الرقمي):</label>
            <input type="text" id="kickUser" placeholder="مثال: 123456 أو ضع الـ ID هنا">
        </div>
        <button onclick="connectKick()">اتصال بالشات 🚀</button>
    </div>

    <div class="status-bar">
        <span id="kickStatus" class="status-indicator">Kick: غير متصل</span>
    </div>

    <div class="quiz-card">
        <div class="question" id="questionText">أرسل (A) أو (B) أو (C) أو (D) في الشات لاحتساب النقاط!</div>
        <div class="options" id="optionsContainer">
            <div class="option-btn">A) الخيار الأول</div>
            <div class="option-btn">B) الخيار الثاني</div>
            <div class="option-btn">C) الخيار الثالث</div>
            <div class="option-btn">D) الخيار الرابع</div>
        </div>
    </div>

    <div class="scores">
        <h3>🏆 لائحة الصدارة:</h3>
        <ul class="score-list" id="scoreList"></ul>
    </div>
</div>

<script>
    let pusherClient = null;
    let currentAnswer = "A"; 
    let scores = {};

    function connectKick() {
        const chatroomId = document.getElementById('kickUser').value.trim();
        if (!chatroomId) {
            alert("الرجاء إدخال رقم الـ Chatroom ID");
            return;
        }

        const status = document.getElementById('kickStatus');
        status.textContent = 'Kick: جاري الاتصال...';

        if (pusherClient) {
            pusherClient.disconnect();
        }

        try {
            // الاتصال المباشر بنظام Pusher الخاص بـ Kick باستخدام رقم الغرفة الحقيقي
            pusherClient = new Pusher('eb1d5f283082ab080b96', {
                cluster: 'us2',
                forceTLS: true
            });

            const channel = pusherClient.subscribe(`chatrooms.${chatroomId}.v2`);

            pusherClient.connection.bind('connected', () => {
                status.textContent = `Kick: متصل (ID: ${chatroomId})`;
                status.classList.add('connected');
            });

            pusherClient.connection.bind('error', (err) => {
                console.error("Pusher Error:", err);
                status.textContent = 'Kick: خطأ بالاتصال';
                status.classList.remove('connected');
            });

            channel.bind('App\\Events\\ChatMessageEvent', (data) => {
                try {
                    const sender = data.sender ? data.sender.username : 'زائر';
                    const content = data.content || '';
                    handleChatMessage(sender, content);
                } catch (e) {
                    console.error("Message parse error:", e);
                }
            });
        } catch (e) {
            status.textContent = 'Kick: خطأ بالاتصال';
            status.classList.remove('connected');
        }
    }

    function handleChatMessage(username, message) {
        const text = message.trim().toUpperCase();
        if (['A', 'B', 'C', 'D'].includes(text)) {
            if (text === currentAnswer) {
                if (!scores[username]) {
                    scores[username] = { name: username, score: 0 };
                }
                scores[username].score += 10;
                updateLeaderboard();
            }
        }
    }

    function updateLeaderboard() {
        const scoreList = document.getElementById('scoreList');
        scoreList.innerHTML = '';
        const sorted = Object.values(scores).sort((a, b) => b.score - a.score);

        sorted.forEach(player => {
            const li = document.createElement('li');
            li.className = 'score-item';
            li.innerHTML = `
                <span><span class="badge-kick">[Kick]</span> ${player.name}</span>
                <span><b>${player.score}</b> نقطة</span>
            `;
            scoreList.appendChild(li);
        });
    }
</script>

</body>
</html>
