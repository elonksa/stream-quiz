<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة أسئلة الشات للبث المباشر - Twitch</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { 
            background-color: #0f0e17; 
            color: #fffffe; 
            margin: 0; 
            padding: 20px; 
            display: flex; 
            gap: 20px; 
            min-height: 100vh; 
        }
        
        .main-container { flex: 3; display: flex; flex-direction: column; gap: 20px; }
        .card { background: #16161a; padding: 25px; border-radius: 16px; border: 1px solid #242629; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
        .sidebar { flex: 1.1; background: #16161a; padding: 20px; border-radius: 16px; border: 1px solid #242629; height: fit-content; }
        
        h2 { color: #7f5af0; margin-top: 0; font-size: 24px; }
        h3 { font-size: 18px; color: #fffffe; margin-bottom: 10px; }
        label { font-size: 14px; color: #94a1b2; font-weight: 600; }
        input[type="text"], input[type="number"], select, button { padding: 14px 16px; font-size: 16px; border-radius: 8px; border: none; margin: 8px 0 16px 0; }
        input[type="text"], input[type="number"], select { background: #242629; color: #fff; border: 1px solid #72757e; width: 100%; }
        
        .categories-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 12px;
            margin: 10px 0 20px 0;
            background: #242629;
            padding: 15px;
            border-radius: 10px;
        }

        .category-item {
            display: flex; align-items: center; gap: 10px; cursor: pointer;
            background: #16161a; padding: 10px; border-radius: 8px; border: 1px solid #383a40;
        }

        .category-item input { width: 18px; height: 18px; accent-color: #7f5af0; }
        .category-item span { font-size: 14px; color: #fffffe; font-weight: bold; }

        button { background: #7f5af0; color: #fff; cursor: pointer; font-weight: bold; width: 100%; transition: 0.2s; }
        button:hover { background: #6b46c1; }
        
        .question-box { 
            background: #242629; padding: 35px 25px; border-radius: 14px; 
            border: 2px solid #7f5af0; text-align: center; margin: 15px 0 10px 0; 
        }
        .question-title { font-size: 26px; font-weight: bold; color: #fffffe; }
        
        .timer-container { width: 100%; background: #0f0e17; height: 14px; border-radius: 7px; overflow: hidden; margin-bottom: 15px; }
        .timer-bar { height: 100%; background: #ff8906; width: 100%; transition: width 0.1s linear; }
        .timer-text { font-size: 18px; font-weight: bold; color: #ff8906; text-align: center; }

        .difficulty-badge { padding: 4px 12px; border-radius: 20px; font-size: 14px; font-weight: bold; }
        .diff-easy { background: #2cb67d; color: #0f0e17; }
        .diff-medium { background: #ff8906; color: #0f0e17; }
        .diff-hard { background: #e53170; color: #fff; }

        .status-box { padding: 18px; font-weight: bold; border-radius: 10px; display: none; margin-top: 15px; text-align: center; font-size: 20px; }
        .status-success { background: #2cb67d; color: #000; }
        .status-timeout { background: #e53170; color: #fff; }

        .leaderboard-list { list-style: none; padding: 0; margin: 0; }
        .leaderboard-item { display: flex; justify-content: space-between; padding: 12px; border-bottom: 1px solid #242629; font-size: 18px; }
        .score { color: #2cb67d; font-weight: bold; }

        .winner-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(15, 14, 23, 0.95); display: none;
            justify-content: center; align-items: center; z-index: 9999;
        }

        .winner-card {
            background: #16161a; border: 3px solid #ff8906; border-radius: 20px;
            padding: 40px; text-align: center; max-width: 500px; width: 90%;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <!-- إعدادات اللعبة -->
        <div id="setup-card" class="card">
            <h2>⚙️ إعدادات اللعبة (متجددة عبر الإنترنت)</h2>
            
            <label>اسم قناة تويتش (Twitch Channel):</label>
            <input type="text" id="channel-input" placeholder="مثال: xsulai">

            <h3>🎯 اختر الفئات المطلوبة:</h3>
            <div class="categories-grid">
                <label class="category-item"><input type="checkbox" class="category-checkbox" value="15" checked><span>🎮 ألعاب وفيديوجيمز</span></label>
                <label class="category-item"><input type="checkbox" class="category-checkbox" value="31" checked><span>🎌 أنمي وكرتون</span></label>
                <label class="category-item"><input type="checkbox" class="category-checkbox" value="11" checked><span>🎬 أفلام وسينما</span></label>
                <label class="category-item"><input type="checkbox" class="category-checkbox" value="18" checked><span>💻 تكنولوجيا وكمبيوتر</span></label>
                <label class="category-item"><input type="checkbox" class="category-checkbox" value="21" checked><span>⚽ رياضة</span></label>
                <label class="category-item"><input type="checkbox" class="category-checkbox" value="22" checked><span>🌍 جغرافيا وطبيعة</span></label>
                <label class="category-item"><input type="checkbox" class="category-checkbox" value="23" checked><span>📜 تاريخ</span></label>
                <label class="category-item"><input type="checkbox" class="category-checkbox" value="17" checked><span>🚀 علوم وفضاء</span></label>
            </div>
            
            <label>مستوى الصعوبة:</label>
            <select id="difficulty-select">
                <option value="easy">🟢 سهل</option>
                <option value="medium" selected>🟠 متوسط</option>
                <option value="hard">🔴 صعب</option>
            </select>

            <label>وقت السؤال (بالثواني):</label>
            <select id="time-select">
                <option value="10" selected>10 ثوانٍ</option>
                <option value="15">15 ثانية</option>
                <option value="20">20 ثانية</option>
            </select>

            <label>نقاط الفوز:</label>
            <input type="number" id="target-score" value="50" step="5">
            
            <button id="start-btn">ابدأ اللعبة 🚀</button>
        </div>

        <!-- منطقة السؤال النشط -->
        <div id="game-card" class="card" style="display: none;">
            <div id="connection-status" style="padding: 10px; background: #ff8906; color: #000; font-weight: bold; text-align: center; border-radius: 8px; margin-bottom: 15px;">جاري الاتصال بالشات...</div>
            
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <div>
                    <span id="category-badge" style="color: #94a1b2; font-size: 16px; font-weight: bold;">المجال: ...</span>
                    <span id="difficulty-badge" class="difficulty-badge diff-easy">متوسط</span>
                </div>
                <span id="timer-text" class="timer-text">المتبقي: 0 ثانية</span>
                <span id="target-display" style="color: #ff8906; font-weight: bold;">هدف الفوز: 0</span>
            </div>

            <div class="timer-container" style="margin-top: 12px;">
                <div id="timer-bar" class="timer-bar"></div>
            </div>
            
            <div class="question-box">
                <div id="question-text" class="question-title">جاري جلب سؤال جديد وترجمته...</div>
            </div>
            
            <div id="status-box" class="status-box"></div>
        </div>
    </div>

    <!-- لوحة المتصدرين -->
    <div class="sidebar">
        <h2>🏆 المتصدرون</h2>
        <ul id="leaderboard" class="leaderboard-list">
            <li style="color: #94a1b2;">في انتظار الإجابات...</li>
        </ul>
    </div>

    <!-- نافذة إعلان الفائز -->
    <div id="winner-overlay" class="winner-overlay">
        <div class="winner-card">
            <div style="font-size: 60px;">🏆</div>
            <h2 style="color: #ff8906; font-size: 32px;">بطل اللعبة!</h2>
            <div id="winner-name-display" style="font-size: 38px; color: #2cb67d; font-weight: bold; margin: 15px 0;">-</div>
            <div id="winner-score-display" style="font-size: 20px; color: #fff; margin-bottom: 20px;">-</div>
            <button onclick="location.reload()" style="background: #ff8906; color: #000; padding: 12px 25px; border-radius: 8px; font-weight: bold;">بدء جولة جديدة 🔄</button>
        </div>
    </div>

    <script>
        let scores = {};
        let targetScore = 50;
        let questionTimeLimit = 10;
        let timeRemaining = 10;
        let timerInterval = null;
        let currentAnswerAr = "";
        let isQuestionActive = false;
        let activeCategories = [];
        let selectedDifficulty = "medium";

        const POINTS_PER_ANSWER = 5;

        document.getElementById('start-btn').addEventListener('click', () => {
            const channelName = document.getElementById('channel-input').value.trim().toLowerCase();
            targetScore = parseInt(document.getElementById('target-score').value) || 50;
            questionTimeLimit = parseInt(document.getElementById('time-select').value) || 10;
            selectedDifficulty = document.getElementById('difficulty-select').value;
            activeCategories = Array.from(document.querySelectorAll('.category-checkbox:checked')).map(cb => cb.value);

            if (!channelName) {
                alert("يرجى إدخال اسم القناة!");
                return;
            }

            if (activeCategories.length === 0) {
                alert("اختر فئة واحدة على الأقل!");
                return;
            }

            document.getElementById('target-display').innerText = `هدف الفوز: ${targetScore} نقطة`;
            document.getElementById('setup-card').style.display = 'none';
            document.getElementById('game-card').style.display = 'block';

            connectTwitch(channelName);
            loadNextApiQuestion();
        });

        // جلب سؤال عشوائي متجدد من الـ API مع ترجمته فورياً
        async function loadNextApiQuestion() {
            isQuestionActive = false;
            clearInterval(timerInterval);
            document.getElementById('status-box').style.display = 'none';
            document.getElementById('question-text').innerText = "جاري جلب سؤال جديد وترجمته...";

            const randomCat = activeCategories[Math.floor(Math.random() * activeCategories.length)];
            const url = `https://opentdb.com/api.php?amount=1&category=${randomCat}&difficulty=${selectedDifficulty}&type=multiple`;

            try {
                const res = await fetch(url);
                const data = await res.json();
                
                if (data.results && data.results.length > 0) {
                    const item = data.results[0];
                    const rawQuestion = decodeHTMLEntities(item.question);
                    const rawAnswer = decodeHTMLEntities(item.correct_answer);

                    // ترجمة السؤال والإجابة إلى العربية تلقائياً
                    const translatedQ = await translateText(rawQuestion);
                    const translatedA = await translateText(rawAnswer);

                    currentAnswerAr = translatedA;
                    document.getElementById('category-badge').innerText = `المجال: ${item.category}`;
                    document.getElementById('question-text').innerText = translatedQ;

                    isQuestionActive = true;
                    startTimer();
                } else {
                    setTimeout(loadNextApiQuestion, 1000);
                }
            } catch (e) {
                console.error("خطأ جلب الأسئلة:", e);
                setTimeout(loadNextApiQuestion, 2000);
            }
        }

        // دالة ترجمة فورية سريعة عبر API مجاني
        async function translateText(text) {
            try {
                const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=en|ar`);
                const data = await res.json();
                return data.responseData.translatedText || text;
            } catch (e) {
                return text;
            }
        }

        function decodeHTMLEntities(text) {
            const textarea = document.createElement('textarea');
            textarea.innerHTML = text;
            return textarea.value;
        }

        function startTimer() {
            clearInterval(timerInterval);
            timeRemaining = questionTimeLimit;
            updateTimerUI();

            timerInterval = setInterval(() => {
                timeRemaining -= 0.1;
                if (timeRemaining <= 0) {
                    clearInterval(timerInterval);
                    handleTimeout();
                } else {
                    updateTimerUI();
                }
            }, 100);
        }

        function updateTimerUI() {
            const percent = Math.max(0, (timeRemaining / questionTimeLimit) * 100);
            document.getElementById('timer-bar').style.width = `${percent}%`;
            document.getElementById('timer-text').innerText = `المتبقي: ${Math.ceil(timeRemaining)} ثانية`;
        }

        function handleTimeout() {
            if (!isQuestionActive) return;
            isQuestionActive = false;

            const statusBox = document.getElementById('status-box');
            statusBox.className = "status-box status-timeout";
            statusBox.style.display = 'block';
            statusBox.innerText = `⏰ انتهى الوقت! الإجابة الصحيحة: (${currentAnswerAr})`;

            setTimeout(loadNextApiQuestion, 3500);
        }

        function connectTwitch(channel) {
            const statusEl = document.getElementById('connection-status');
            const socket = new WebSocket('wss://irc-ws.chat.twitch.tv:443');

            socket.onopen = () => {
                socket.send('CAP REQ :twitch.tv/tags twitch.tv/commands');
                socket.send(`NICK justinfan${Math.floor(Math.random() * 80000 + 10000)}`);
                socket.send(`JOIN #${channel}`);
                statusEl.innerText = `🟢 متصل بشات تويتش: #${channel}`;
                statusEl.style.background = "#2cb67d";
            };

            socket.onmessage = (event) => {
                const raw = event.data;
                if (raw.startsWith('PING')) socket.send('PONG :tmi.twitch.tv');
                if (raw.includes('PRIVMSG')) {
                    let username = "متابع";
                    const nameMatch = raw.match(/display-name=([^;]+)/);
                    if (nameMatch && nameMatch[1]) username = nameMatch[1];
                    else {
                        const userMatch = raw.match(/:(\w+)!/);
                        if (userMatch) username = userMatch[1];
                    }

                    const msgIndex = raw.indexOf(`PRIVMSG #${channel} :`);
                    if (msgIndex !== -1) {
                        const message = raw.substring(msgIndex + channel.length + 11).trim();
                        processAnswer(username, message);
                    }
                }
            };
        }

        function normalizeText(text) {
            if (!text) return "";
            return text.toString().trim().toLowerCase()
                .replace(/[أإآ]/g, 'ا')
                .replace(/ة/g, 'ه')
                .replace(/^ال/, '')
                .replace(/\s+/g, '');
        }

        function processAnswer(username, userMsg) {
            if (!isQuestionActive || !currentAnswerAr) return;

            const cleanUserMsg = normalizeText(userMsg);
            const cleanCorrectMsg = normalizeText(currentAnswerAr);

            if (cleanUserMsg === cleanCorrectMsg || cleanUserMsg.includes(cleanCorrectMsg)) {
                handleCorrectAnswer(username);
            }
        }

        function handleCorrectAnswer(winnerUsername) {
            isQuestionActive = false;
            clearInterval(timerInterval);

            scores[winnerUsername] = (scores[winnerUsername] || 0) + POINTS_PER_ANSWER;
            updateLeaderboard();

            const statusBox = document.getElementById('status-box');
            statusBox.className = "status-box status-success";
            statusBox.style.display = 'block';
            statusBox.innerText = `🎉 إجابة صحيحة! ${winnerUsername} نال 5 نقاط! (${currentAnswerAr})`;

            if (scores[winnerUsername] >= targetScore) {
                setTimeout(() => triggerVictory(winnerUsername), 800);
                return;
            }

            setTimeout(loadNextApiQuestion, 3500);
        }

        function updateLeaderboard() {
            const leaderboardEl = document.getElementById('leaderboard');
            leaderboardEl.innerHTML = "";
            const sortedPlayers = Object.entries(scores).sort((a, b) => b[1] - a[1]);

            sortedPlayers.forEach(([player, score]) => {
                const li = document.createElement('li');
                li.className = 'leaderboard-item';
                li.innerHTML = `<span>${player}</span> <span class="score">${score} نقطة</span>`;
                leaderboardEl.appendChild(li);
            });
        }

        function triggerVictory(winnerUsername) {
            document.getElementById('winner-name-display').innerText = winnerUsername;
            document.getElementById('winner-score-display').innerText = `وصل إلى ${scores[winnerUsername]} نقطة وحقق المركز الأول! 🎉`;
            document.getElementById('winner-overlay').style.display = 'flex';

            confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
        }
    </script>
</body>
</html>
