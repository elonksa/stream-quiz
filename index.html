<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة أسئلة الشات للبث المباشر</title>
    <!-- مكتبة الألعاب النارية والورقية 🎉 -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { 
            background-color: #0f0e17; 
            color: #fffffe; 
            margin: 0; 
            padding: 20px; 
            display: flex; 
            gap: 20px; 
            position: relative; 
            min-height: 100vh; 
            overflow-x: hidden; 
        }
        
        .main-container { flex: 3; display: flex; flex-direction: column; gap: 20px; }
        .card { background: #16161a; padding: 25px; border-radius: 16px; border: 1px solid #242629; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
        .sidebar { flex: 1.1; background: #16161a; padding: 20px; border-radius: 16px; border: 1px solid #242629; height: fit-content; }
        
        h2, h3 { color: #7f5af0; margin-top: 0; font-size: 24px; }
        h3 { font-size: 18px; color: #fffffe; margin-bottom: 10px; }
        label { font-size: 14px; color: #94a1b2; font-weight: 600; }
        input[type="text"], input[type="number"], select, button { padding: 14px 16px; font-size: 16px; border-radius: 8px; border: none; margin: 8px 0 16px 0; }
        input[type="text"], input[type="number"], select { background: #242629; color: #fff; border: 1px solid #72757e; width: 100%; }
        input:focus, select:focus { border-color: #7f5af0; outline: none; }
        
        /* شبكة المجالات المتنوعة */
        .categories-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 12px;
            margin: 10px 0 20px 0;
            background: #242629;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #72757e;
        }

        .category-item {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            background: #16161a;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #383a40;
            transition: all 0.2s ease;
        }

        .category-item:hover {
            border-color: #7f5af0;
        }

        .category-item input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #7f5af0;
            cursor: pointer;
        }

        .category-item span {
            font-size: 14px;
            color: #fffffe;
            font-weight: bold;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        .small-btn {
            background: #242629;
            color: #94a1b2;
            padding: 6px 12px;
            font-size: 13px;
            border: 1px solid #72757e;
            width: auto;
            margin: 0;
        }

        .small-btn:hover {
            background: #7f5af0;
            color: #fff;
        }

        button { background: #7f5af0; color: #fff; cursor: pointer; font-weight: bold; width: 100%; transition: all 0.2s ease; margin-top: 10px; }
        button:hover { background: #6b46c1; transform: translateY(-2px); }
        
        /* مربع عرض السؤال الرئيسي */
        .question-box { 
            background: #242629; 
            padding: 35px 25px; 
            border-radius: 14px; 
            border: 2px solid #7f5af0; 
            text-align: center; 
            margin: 15px 0 10px 0; 
            position: relative; 
            box-shadow: inset 0 0 15px rgba(127, 90, 240, 0.2);
        }
        .question-title { font-size: 28px; font-weight: bold; color: #fffffe; margin: 0; line-height: 1.5; }
        
        /* شريط العداد التنازلي */
        .timer-container { width: 100%; background-color: #0f0e17; height: 14px; border-radius: 7px; overflow: hidden; margin-bottom: 15px; border: 1px solid #72757e; }
        .timer-bar { height: 100%; background-color: #ff8906; width: 100%; transition: width 0.1s linear, background-color 0.3s ease; }
        .timer-text { font-size: 18px; font-weight: bold; color: #ff8906; text-align: center; }

        .difficulty-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            margin-right: 10px;
        }
        .diff-easy { background: #2cb67d; color: #0f0e17; }
        .diff-medium { background: #ff8906; color: #0f0e17; }
        .diff-hard { background: #e53170; color: #ffffff; }

        .status-box { padding: 18px; font-weight: bold; border-radius: 10px; display: none; margin-top: 15px; text-align: center; font-size: 22px; }
        .status-success { background: #2cb67d; color: #000; }
        .status-timeout { background: #e53170; color: #fff; }

        .leaderboard-list { list-style: none; padding: 0; margin: 0; }
        .leaderboard-item { display: flex; justify-content: space-between; padding: 12px; border-bottom: 1px solid #242629; font-size: 18px; }
        .score { color: #2cb67d; font-weight: bold; }
        
        .connection-status { padding: 12px; border-radius: 8px; font-size: 15px; font-weight: bold; text-align: center; margin-bottom: 15px; }
        .status-connecting { background: #ff8906; color: #000; }
        .status-connected { background: #2cb67d; color: #000; }

        /* 👑 شاشة الإعلان عن الفائز */
        .winner-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(15, 14, 23, 0.94);
            backdrop-filter: blur(8px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            flex-direction: column;
        }

        .winner-card {
            background: linear-gradient(135deg, #16161a 0%, #242629 100%);
            border: 3px solid #ff8906;
            box-shadow: 0 0 50px rgba(255, 137, 6, 0.4);
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            max-width: 500px;
            width: 90%;
            animation: popup 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes popup {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .winner-title { font-size: 36px; color: #ff8906; margin-bottom: 10px; font-weight: 900; }
        .winner-name { font-size: 42px; color: #2cb67d; font-weight: bold; text-shadow: 0 0 15px rgba(44, 182, 125, 0.5); margin: 15px 0; }
        .winner-score { font-size: 22px; color: #fffffe; margin-bottom: 25px; }
        .restart-btn { background: #ff8906; color: #000; font-size: 18px; padding: 15px 30px; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; }
        .restart-btn:hover { background: #e07800; }
    </style>
</head>
<body>

    <div class="main-container">
        <!-- إعدادات البداية -->
        <div id="setup-card" class="card">
            <h2>⚙️ إعدادات اللعبة</h2>
            
            <label>اسم قناة تويتش (Channel Name):</label>
            <input type="text" id="channel-input" placeholder="مثال: xsulaix">

            <!-- أزرار تحديد مجالات الأسئلة التفاعلية -->
            <div style="margin-top: 10px;">
                <h3>🎯 حدد مجالات الأسئلة (12 مجالاً متنوعاً):</h3>
                <div class="btn-group">
                    <button type="button" class="small-btn" onclick="toggleAllCategories(true)">تحديد الكل</button>
                    <button type="button" class="small-btn" onclick="toggleAllCategories(false)">إلغاء الكل</button>
                </div>
                <div class="categories-grid">
                    <label class="category-item"><input type="checkbox" class="category-checkbox" value="أنمي ومانجا" checked><span>🎌 أنمي ومانجا</span></label>
                    <label class="category-item"><input type="checkbox" class="category-checkbox" value="سينما ودراما" checked><span>🎬 سينما ودراما</span></label>
                    <label class="category-item"><input type="checkbox" class="category-checkbox" value="ألعاب وفيديوجيمز" checked><span>🎮 ألعاب وفيديوجيمز</span></label>
                    <label class="category-item"><input type="checkbox" class="category-checkbox" value="رياضة وكرة قدم" checked><span>⚽ رياضة وكرة قدم</span></label>
                    <label class="category-item"><input type="checkbox" class="category-checkbox" value="تكنولوجيا وتقنية" checked><span>💻 تكنولوجيا وتقنية</span></label>
                    <label class="category-item"><input type="checkbox" class="category-checkbox" value="جغرافيا وطبيعة" checked><span>🌍 جغرافيا وطبيعة</span></label>
                    <label class="category-item"><input type="checkbox" class="category-checkbox" value="تاريخ وإسلاميات" checked><span>📜 تاريخ وإسلاميات</span></label>
                    <label class="category-item"><input type="checkbox" class="category-checkbox" value="صحة وطب" checked><span>🏥 صحة وطب</span></label>
                    <label class="category-item"><input type="checkbox" class="category-checkbox" value="أدب وشعر" checked><span>📚 أدب وشعر</span></label>
                    <label class="category-item"><input type="checkbox" class="category-checkbox" value="سيارات ومحركات" checked><span>🏎️ سيارات ومحركات</span></label>
                    <label class="category-item"><input type="checkbox" class="category-checkbox" value="علوم وفضاء" checked><span>🚀 علوم وفضاء</span></label>
                    <label class="category-item"><input type="checkbox" class="category-checkbox" value="ألغاز وسرعة بديهة" checked><span>🧩 ألغاز وسرعة بديهة</span></label>
                </div>
            </div>
            
            <label>مستوى صعوبة الأسئلة المطلوب:</label>
            <select id="difficulty-select">
                <option value="dynamic" selected>🔄 متدرج تلقائياً (من السهل إلى الصعب مع الوقت)</option>
                <option value="easy">🟢 سهل (معلومات خفيفة)</option>
                <option value="medium">🟠 متوسط (تحدي مناسب للشات)</option>
                <option value="hard">🔴 صعب (للمحترفين)</option>
            </select>

            <label>وقت السؤال (بالثواني):</label>
            <select id="time-select">
                <option value="5">5 ثوانٍ (سريع جداً)</option>
                <option value="10" selected>10 ثوانٍ (متوسط - موصى به)</option>
                <option value="15">15 ثانية</option>
                <option value="20">20 ثانية</option>
                <option value="30">30 ثانية</option>
            </select>

            <label>نقاط الفوز (Winning Target):</label>
            <input type="number" id="target-score" value="100" step="5">
            
            <button id="start-btn">ابدأ اللعبة 🚀</button>
        </div>

        <!-- منطقة السؤال النشط -->
        <div id="game-card" class="card" style="display: none;">
            <div id="connection-status" class="connection-status status-connecting">جاري الاتصال بشات تويتش...</div>
            
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <div>
                    <span id="category-badge" style="color: #94a1b2; font-size: 18px; font-weight: bold;">المجال: ...</span>
                    <span id="difficulty-badge" class="difficulty-badge diff-easy">سهل</span>
                </div>
                <span id="timer-text" class="timer-text">المتبقي: 0 ثانية</span>
                <span id="target-display" style="color: #ff8906; font-weight: bold; font-size: 18px;">هدف الفوز: 0 نقطة</span>
            </div>

            <!-- شريط العداد التنازلي -->
            <div class="timer-container" style="margin-top: 12px;">
                <div id="timer-bar" class="timer-bar"></div>
            </div>
            
            <!-- مربع السؤال -->
            <div class="question-box">
                <div id="question-text" class="question-title">جاري تحميل السؤال...</div>
            </div>
            
            <div id="status-box" class="status-box"></div>

            <!-- مربع تجربة يدوي -->
            <div style="margin-top: 20px; padding-top: 15px; border-top: 1px dashed #72757e;">
                <label style="font-size: 12px; color: #94a1b2;">اختبار يدوي (محاكاة إجابة الشات):</label>
                <div style="display: flex; gap: 10px;">
                    <input type="text" id="test-chat-input" placeholder="اكتب كلمة الإجابة واضغط اختبار...">
                    <button id="test-chat-btn" style="width: auto;">اختبار 🧪</button>
                </div>
            </div>
        </div>
    </div>

    <!-- لوحة المتصدرين -->
    <div class="sidebar">
        <h2>🏆 المتصدرون</h2>
        <ul id="leaderboard" class="leaderboard-list">
            <li style="color: #94a1b2;">في انتظار الإجابات...</li>
        </ul>
    </div>

    <!-- 🏆 نافذة إعلان الفائز -->
    <div id="winner-overlay" class="winner-overlay">
        <div class="winner-card">
            <div style="font-size: 60px; margin-bottom: 10px;">🏆</div>
            <div class="winner-title">بطل اللعبة!</div>
            <div id="winner-name-display" class="winner-name">XsulaiX</div>
            <div id="winner-score-display" class="winner-score">وصل إلى 100 نقطة بنجاح! 🎉</div>
            <button class="restart-btn" onclick="resetGame()">بدء جولة جديدة 🔄</button>
        </div>
    </div>

    <script>
        // ==========================================
        // 📚 بنك أسئلة موسّع وشامل لـ 12 مجالاً مختلفاً
        // ==========================================
        
        const questionPool = {
            easy: [
                // أنمي
                { category: "أنمي ومانجا", question: "ما اسم القرصان صاحب قبعة القش في أنمي ون بيس؟", correct: ["لوفي", "مونكي دي لوفي"] },
                { category: "أنمي ومانجا", question: "ما اسم الوحش المحبوس داخل ناروتو؟", correct: ["الكيوبي", "كوراما"] },
                // سينما ودراما
                { category: "سينما ودراما", question: "ما اسم المسلسل الكوري الشهير صاحب لعبة 'الضوء الأحمر والضوء الأخضر'؟", correct: ["لعبة الحبار", "squid game"] },
                // ألعاب
                { category: "ألعاب وفيديوجيمز", question: "ما اسم البطل الرئيسي في سلسلة ألعاب God of War؟", correct: ["كريتوس", "كرايتوس", "kratos"] },
                // رياضة
                { category: "رياضة وكرة قدم", question: "من هو اللاعب الملقب بـ 'الدون'؟", correct: ["كريستيانو رونالدو", "رونالدو", "كريستيانو"] },
                // تكنولوجيا وتقنية
                { category: "تكنولوجيا وتقنية", question: "ما اسم نظام التشغيل للهواتف الذكية المطور من قبل شركة جوجل؟", correct: ["اندرويد", "أندرويد", "android"] },
                { category: "تكنولوجيا وتقنية", question: "ما هي الشركة المالكة لنظام التشغيل ويندوز Windows؟", correct: ["مايكروسوفت", "microsoft"] },
                // جغرافيا وطبيعة
                { category: "جغرافيا وطبيعة", question: "ما هي عاصمة المملكة العربية السعودية؟", correct: ["الرياض"] },
                { category: "جغرافيا وطبيعة", question: "ما هو أكبر محيط في العالم مساحة؟", correct: ["الهادئ", "المحيط الهادئ"] },
                // تاريخ وإسلاميات
                { category: "تاريخ وإسلاميات", question: "ما هي أطول سورة في القرآن الكريم؟", correct: ["البقرة", "سورة البقرة"] },
                // صحة وطب
                { category: "صحة وطب", question: "ما هو العضو المسؤول عن ضخ الدم لكل أجزاء الجسم؟", correct: ["القلب"] },
                // أدب وشعر
                { category: "أدب وشعر", question: "من هو الشاعر الملقب بـ 'أمير الشعراء'؟", correct: ["أحمد شوقي", "احمد شوقي"] },
                // سيارات ومحركات
                { category: "سيارات ومحركات", question: "ما اسم الشركة الألمانية الشهيرة التي تحتوي علامتها على 4 حلقات متداخلة؟", correct: ["أودي", "اودي", "audi"] },
                // علوم وفضاء
                { category: "علوم وفضاء", question: "ما هو الكوكب الملقب بـ 'الكوكب الأحمر'؟", correct: ["المريخ"] },
                // ألغاز وسرعة بديهة
                { category: "ألغاز وسرعة بديهة", question: "ما هو الشيء الذي كلما أخذت منه كَبُر؟", correct: ["الحفرة"] }
            ],
            medium: [
                // أنمي
                { category: "أنمي ومانجا", question: "ما اسم المفكرة التي تقتل أي شخص يُكتب اسمه فيها؟", correct: ["دفتر الموت", "مذكرة الموت", "death note"] },
                // سينما ودراما
                { category: "سينما ودراما", question: "ما اسم الممثل الذي لعب دور 'الجوكر' في فيلم The Dark Knight عام 2008؟", correct: ["هيث ليدجر"] },
                // ألعاب
                { category: "ألعاب وفيديوجيمز", question: "ما هي الشركة المبرمجة والمالكة للعبة League of Legends؟", correct: ["رايوت", "رايوت جيمز", "riot"] },
                // رياضة
                { category: "رياضة وكرة قدم", question: "من هو المدرب التاريخي لنادي مانشستر يونايتد الذي أعتزل عام 2013؟", correct: ["فيرغسون", "سير أليكس فيرغسون", "فيرجسون"] },
                // تكنولوجيا وتقنية
                { category: "تكنولوجيا وتقنية", question: "ما اسم اللغة الأساسية المستخدمة لتنسيق وتصميم صفحات الويب وتحديد ألوانها وشكلها؟", correct: ["css"] },
                // جغرافيا وطبيعة
                { category: "جغرافيا وطبيعة", question: "ما هي عاصمة أستراليا؟", correct: ["كانبرا", "كانبيرا"] },
                // تاريخ وإسلاميات
                { category: "تاريخ وإسلاميات", question: "في أي سنة ميلادية فتح المسلمون مكة (فتح مكة)؟", correct: ["630", "630م"] },
                // صحة وطب
                { category: "صحة وطب", question: "ما هي المادة المسؤولة عن إعطاء اللون للبشرة والشعر لدى الإنسان؟", correct: ["الميلانين", "ميلانين"] },
                // أدب وشعر
                { category: "أدب وشعر", question: "من هو مؤلف رواية 'البؤساء' الشهيرة؟", correct: ["فيكتور هوغو", "فيكتور هوجو"] },
                // سيارات ومحركات
                { category: "سيارات ومحركات", question: "ما اسم قسم الأداء العالي والرياضي في شركة بي إم دبليو BMW؟", correct: ["M", "قسم M", "ام"] },
                // علوم وفضاء
                { category: "علوم وفضاء", question: "ما هو العنصر الكيميائي الأكثر وفرة في الكون؟", correct: ["الهيدروجين"] },
                // ألغاز وسرعة بديهة
                { category: "ألغاز وسرعة بديهة", question: "ما هو الشيء الذي يمشي ويقف وليس له أرجل؟", correct: ["الساعة", "ساعة"] }
            ],
            hard: [
                // أنمي
                { category: "أنمي ومانجا", question: "ما اسم السيف الأول الذي يمتلكه زورو والمقترن بوعد صديقته كوينا في ون بيس؟", correct: ["واذو إيتشيمونجي", "واذو ايتشيمونجي", "ايتشيمونجي"] },
                // سينما ودراما
                { category: "سينما ودراما", question: "في مسلسل Breaking Bad، ما اسم المطعم الوهمي المملوك لـ غوس فرينغ؟", correct: ["لوس بولوس هيرمانوس", "لوس بولوس"] },
                // ألعاب
                { category: "ألعاب وفيديوجيمز", question: "ما اسم السيف الأسطوري المملوك لـ لينك في سلسلة ألعاب The Legend of Zelda؟", correct: ["ماستر سورد", "master sword"] },
                // رياضة
                { category: "رياضة وكرة قدم", question: "من هو اللاعب الذي سجل هدف الفوز لإسبانيا في نهائي كأس العالم 2010؟", correct: ["إنييستا", "انيستا", "أندريس إنييستا"] },
                // تكنولوجيا وتقنية
                { category: "تكنولوجيا وتقنية", question: "ما اسم أول كمبيوتر ميكانيكي قابل للبرمجة ابتكره تشارلز باباج؟", correct: ["المحرك التحليلي", "الآلة التحليلية"] },
                // جغرافيا وطبيعة
                { category: "جغرافيا وطبيعة", question: "ما هي عاصمة دولة كازاخستان الحالية؟", correct: ["أستانا", "استانا", "نور سلطان"] },
                // تاريخ وإسلاميات
                { category: "تاريخ وإسلاميات", question: "من هو القائد المسلم الذي فتح أندلوسيا (الأندلس)؟", correct: ["طارق بن زياد", "طارق زياد"] },
                // صحة وطب
                { category: "صحة وطب", question: "ما اسم الغدة الملقبة بـ 'سيدة الغدد' لسيطرتها على بقية الهرمونات؟", correct: ["النخامية", "الغدة النخامية"] },
                // أدب وشعر
                { category: "أدب وشعر", question: "من صاحب البيت الشهير: (الخَيْلُ وَاللّيْلُ وَالبَيْداءُ تَعرِفُني)؟", correct: ["المتنبي", "أبو الطيب المتنبي"] },
                // سيارات ومحركات
                { category: "سيارات ومحركات", question: "ما هي أسرع سيارة إنتاجية مخصصة للطرق في العالم وتخطت حاجز 490 كم/س؟", correct: ["بوغاتي تشيرون", "بوغاتي", "bugatti"] },
                // علوم وفضاء
                { category: "علوم وفضاء", question: "ما هي أقرب مجرة لكوكبة مجرتنا (درب التبانة)؟", correct: ["أندروميدا", "اندرومايدا", "المرأة المسلسلة"] },
                // ألغاز وسرعة بديهة
                { category: "ألغاز وسرعة بديهة", question: "شيء مليء بالثقوب ولكنه يحتفظ بالماء، فما هو؟", correct: ["الإسفنج", "الاسفنج"] }
            ]
        };

        let usedQuestions = new Set();
        let scores = {};
        let targetScore = 100;
        let questionTimeLimit = 10;
        let timeRemaining = 10;
        let timerInterval = null;
        let currentQuestionObj = null;
        let isQuestionActive = false;
        let roundQuestionCount = 0;
        let categoryIndex = 0;
        let selectedDifficultyMode = "dynamic";
        let activeCategories = [];

        const POINTS_PER_ANSWER = 5;

        function toggleAllCategories(selectAll) {
            document.querySelectorAll('.category-checkbox').forEach(cb => {
                cb.checked = selectAll;
            });
        }

        document.getElementById('start-btn').addEventListener('click', () => {
            const channelName = document.getElementById('channel-input').value.trim().toLowerCase();
            targetScore = parseInt(document.getElementById('target-score').value) || 100;
            questionTimeLimit = parseInt(document.getElementById('time-select').value) || 10;
            selectedDifficultyMode = document.getElementById('difficulty-select').value;

            // تجميع كافة المجالات النشطة المحددة من قبل الستريمر
            activeCategories = Array.from(document.querySelectorAll('.category-checkbox:checked')).map(cb => cb.value);

            if (!channelName) {
                alert("يرجى إدخال اسم قناة تويتش!");
                return;
            }

            if (activeCategories.length === 0) {
                alert("يرجى اختيار مجال واحد على الأقل لتبدأ اللعبة!");
                return;
            }

            document.getElementById('target-display').innerText = `هدف الفوز: ${targetScore} نقطة`;
            document.getElementById('setup-card').style.display = 'none';
            document.getElementById('game-card').style.display = 'block';

            loadNextQuestion();
            connectDirectTwitchWS(channelName);
        });

        document.getElementById('test-chat-btn').addEventListener('click', () => {
            const input = document.getElementById('test-chat-input');
            if (input.value && isQuestionActive) {
                processAnswer("مُختبِر_يدوي", input.value);
                input.value = "";
            }
        });

        function getNextQuestion() {
            let difficulty = "easy";

            if (selectedDifficultyMode === "dynamic") {
                if (roundQuestionCount > 8) difficulty = "hard";
                else if (roundQuestionCount > 4) difficulty = "medium";
            } else {
                difficulty = selectedDifficultyMode;
            }

            const targetCategory = activeCategories[categoryIndex % activeCategories.length];
            categoryIndex++;

            let availablePool = questionPool[difficulty].filter(q => q.category === targetCategory && !usedQuestions.has(q.question));

            if (availablePool.length === 0) {
                const allDiffs = ["easy", "medium", "hard"];
                for (let d of allDiffs) {
                    availablePool = questionPool[d].filter(q => q.category === targetCategory && !usedQuestions.has(q.question));
                    if (availablePool.length > 0) { difficulty = d; break; }
                }
            }

            if (availablePool.length === 0) {
                const allDiffs = ["easy", "medium", "hard"];
                for (let d of allDiffs) {
                    availablePool = questionPool[d].filter(q => activeCategories.includes(q.category) && !usedQuestions.has(q.question));
                    if (availablePool.length > 0) { difficulty = d; break; }
                }
            }

            if (availablePool.length === 0) {
                usedQuestions.clear();
                return getNextQuestion();
            }

            const selectedQuestion = availablePool[Math.floor(Math.random() * availablePool.length)];
            selectedQuestion.difficulty = difficulty;
            usedQuestions.add(selectedQuestion.question);
            return selectedQuestion;
        }

        function loadNextQuestion() {
            isQuestionActive = false;
            clearInterval(timerInterval);

            const statusBox = document.getElementById('status-box');
            statusBox.style.display = 'none';

            roundQuestionCount++;
            currentQuestionObj = getNextQuestion();

            document.getElementById('category-badge').innerText = `المجال: ${currentQuestionObj.category}`;
            
            const diffBadge = document.getElementById('difficulty-badge');
            if (currentQuestionObj.difficulty === "easy") {
                diffBadge.innerText = "سهل 🟢";
                diffBadge.className = "difficulty-badge diff-easy";
            } else if (currentQuestionObj.difficulty === "medium") {
                diffBadge.innerText = "متوسط 🟠";
                diffBadge.className = "difficulty-badge diff-medium";
            } else {
                diffBadge.innerText = "صعب 🔥";
                diffBadge.className = "difficulty-badge diff-hard";
            }

            document.getElementById('question-text').innerText = currentQuestionObj.question;

            isQuestionActive = true;
            startTimer();
        }

        function startTimer() {
            clearInterval(timerInterval);
            timeRemaining = questionTimeLimit;
            updateTimerUI();

            timerInterval = setInterval(() => {
                timeRemaining -= 0.1;

                if (timeRemaining <= 0) {
                    clearInterval(timerInterval);
                    handleTimeout();
                } else {
                    updateTimerUI();
                }
            }, 100);
        }

        function updateTimerUI() {
            const percent = Math.max(0, (timeRemaining / questionTimeLimit) * 100);
            const timerBar = document.getElementById('timer-bar');
            const timerText = document.getElementById('timer-text');

            timerBar.style.width = `${percent}%`;
            timerText.innerText = `المتبقي: ${Math.ceil(timeRemaining)} ثانية`;

            if (percent < 30) {
                timerBar.style.backgroundColor = '#e53170';
            } else {
                timerBar.style.backgroundColor = '#ff8906';
            }
        }

        function handleTimeout() {
            if (!isQuestionActive) return;
            isQuestionActive = false;

            const statusBox = document.getElementById('status-box');
            statusBox.className = "status-box status-timeout";
            statusBox.style.display = 'block';
            statusBox.innerText = `⏰ انتهى الوقت! الإجابة الصحيحة: (${currentQuestionObj.correct[0]})`;

            setTimeout(loadNextQuestion, 3000);
        }

        function connectDirectTwitchWS(channel) {
            const statusEl = document.getElementById('connection-status');
            const socket = new WebSocket('wss://irc-ws.chat.twitch.tv:443');

            socket.onopen = () => {
                const nick = 'justinfan' + Math.floor(Math.random() * 80000 + 10000);
                socket.send('CAP REQ :twitch.tv/tags twitch.tv/commands');
                socket.send(`NICK ${nick}`);
                socket.send(`JOIN #${channel}`);
                
                statusEl.innerText = `🟢 متصل بشات القناة: #${channel}`;
                statusEl.className = "connection-status status-connected";
            };

            socket.onmessage = (event) => {
                const raw = event.data;

                if (raw.startsWith('PING')) {
                    socket.send('PONG :tmi.twitch.tv');
                    return;
                }

                if (raw.includes('PRIVMSG')) {
                    let username = "متابع";
                    const nameMatch = raw.match(/display-name=([^;]+)/);
                    if (nameMatch && nameMatch[1]) {
                        username = nameMatch[1];
                    } else {
                        const userMatch = raw.match(/:(\w+)!/);
                        if (userMatch) username = userMatch[1];
                    }

                    const msgIndex = raw.indexOf(`PRIVMSG #${channel} :`);
                    if (msgIndex !== -1) {
                        const message = raw.substring(msgIndex + channel.length + 11).trim();
                        processAnswer(username, message);
                    }
                }
            };

            socket.onerror = () => {
                statusEl.innerText = `🔴 خطأ في الاتصال بشات تويتش`;
                statusEl.className = "connection-status status-connecting";
            };
        }

        function normalizeText(text) {
            if (!text) return "";
            return text.toString().trim().toLowerCase()
                .replace(/[أإآ]/g, 'ا')
                .replace(/ة/g, 'ه')
                .replace(/^ال/, '')
                .replace(/\s+/g, '');
        }

        function processAnswer(username, userMsg) {
            if (!isQuestionActive || !currentQuestionObj) return;

            const cleanUserMsg = normalizeText(userMsg);
            const isCorrect = currentQuestionObj.correct.some(ans => normalizeText(ans) === cleanUserMsg);

            if (isCorrect) {
                handleCorrectAnswer(username);
            }
        }

        function handleCorrectAnswer(winnerUsername) {
            isQuestionActive = false;
            clearInterval(timerInterval);

            scores[winnerUsername] = (scores[winnerUsername] || 0) + POINTS_PER_ANSWER;
            updateLeaderboard();

            const statusBox = document.getElementById('status-box');
            statusBox.className = "status-box status-success";
            statusBox.style.display = 'block';
            statusBox.innerText = `🎉 إجابة صحيحة! ${winnerUsername} نال 5 نقاط! (الإجابة: ${currentQuestionObj.correct[0]})`;

            if (scores[winnerUsername] >= targetScore) {
                setTimeout(() => triggerVictory(winnerUsername), 800);
                return;
            }

            setTimeout(loadNextQuestion, 3500);
        }

        function triggerVictory(winnerUsername) {
            document.getElementById('winner-name-display').innerText = winnerUsername;
            document.getElementById('winner-score-display').innerText = `وصل إلى ${scores[winnerUsername]} نقطة وحقق المركز الأول! 🎉`;
            document.getElementById('winner-overlay').style.display = 'flex';

            const duration = 5 * 1000;
            const animationEnd = Date.now() + duration;
            const defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 10000 };

            function randomInRange(min, max) { return Math.random() * (max - min) + min; }

            const interval = setInterval(function() {
                const timeLeft = animationEnd - Date.now();
                if (timeLeft <= 0) return clearInterval(interval);

                const particleCount = 50 * (timeLeft / duration);
                confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } }));
                confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } }));
            }, 250);
        }

        function resetGame() {
            scores = {};
            usedQuestions.clear();
            roundQuestionCount = 0;
            categoryIndex = 0;
            updateLeaderboard();
            document.getElementById('winner-overlay').style.display = 'none';
            loadNextQuestion();
        }

        function updateLeaderboard() {
            const leaderboardEl = document.getElementById('leaderboard');
            leaderboardEl.innerHTML = "";
            const sortedPlayers = Object.entries(scores).sort((a, b) => b[1] - a[1]);

            if (sortedPlayers.length === 0) {
                leaderboardEl.innerHTML = '<li style="color: #94a1b2;">في انتظار الإجابات...</li>';
                return;
            }

            sortedPlayers.forEach(([player, score]) => {
                const li = document.createElement('li');
                li.className = 'leaderboard-item';
                li.innerHTML = `<span>${player}</span> <span class="score">${score} نقطة</span>`;
                leaderboardEl.appendChild(li);
            });
        }
    </script>
